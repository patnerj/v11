services:
  - type: web
    name: alphacapital-ws-gateway
    env: node
    rootDir: ws-server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: SECRET_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_TOTAL_CLIENTS
        value: "10000"
      - key: MAX_CLIENTS_PER_IP
        value: "50"

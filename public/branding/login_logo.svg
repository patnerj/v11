<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emeraldGradL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00F5A0" />
    </linearGradient>
    <linearGradient id="textGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glowL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- MassFunded M Emblem -->
  <g transform="translate(15, 12)">
    <rect width="76" height="76" rx="20" fill="#070C1B" stroke="url(#emeraldGradL)" stroke-width="1.5" />
    <g transform="translate(10, 10) scale(0.11)" filter="url(#glowL)">
      <path d="M 120 380 L 120 160 L 195 160 L 256 280 L 317 160 L 392 160 L 392 380 L 332 380 L 332 245 L 282 345 L 230 345 L 180 245 L 180 380 Z" fill="url(#emeraldGradL)" />
      <polygon points="256,110 276,135 256,160 236,135" fill="#00F5A0" />
    </g>
  </g>

  <!-- Typography -->
  <text x="110" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8">
    Mass<tspan fill="url(#textGradL)">Funded</tspan>
  </text>
  <text x="112" y="78" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#94A3B8" letter-spacing="2.5" text-transform="uppercase">
    THE INSTITUTIONAL PROP PLATFORM
  </text>
</svg>
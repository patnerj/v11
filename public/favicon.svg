  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" opacity="0.4" />
  <g filter="url(#glow)">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00F5A0" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#070C1B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="url(#cyanGrad)" stroke-width="6" opacity="0.3" />
  <g filter="url(#glow)">
    <!-- Main stylized 'A' with ascending arrow -->
    <path d="M 140 400 L 256 120 L 330 290 L 285 305 L 256 230 L 205 350 L 270 350 L 260 400 L 140 400 Z" fill="url(#cyanGrad)" />
    <!-- Dynamic Growth Arrow Path -->
    <path d="M 230 400 L 320 280 L 375 220 L 365 190 L 430 190 L 430 255 L 400 245 L 350 305 L 270 400 Z" fill="#00F5A0" />
  </g>
</svg>
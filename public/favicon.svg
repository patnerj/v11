    <path d="M 120 380 L 120 160 L 195 160 L 256 280 L 317 160 L 392 160 L 392 380 L 332 380 L 332 245 L 282 345 L 230 345 L 180 245 L 180 380 Z" fill="url(#emeraldGrad)" />

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Alpha Capital</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: #070C18;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: rgba(0, 210, 255, 0.1);
      border: 2px solid #00D2FF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 900;
      color: #00D2FF;
      margin-bottom: 20px;
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
    p { font-size: 14px; color: #8E9BAE; margin-bottom: 24px; max-width: 280px; line-height: 1.5; }
    .btn {
      background: #00D2FF;
      color: #060A12;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 210, 255, 0.2);
      border-top-color: #00D2FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">A</div>
  <div class="spinner"></div>
  <h1>Connecting to Terminal...</h1>
  <p>Connecting to Alpha Capital Live Prop Firm Servers.</p>
  <button class="btn" onclick="window.location.href='https://demo.launchapropfirm.com'">Retry Connection</button>
  <script>
    // Auto redirect to live platform
    setTimeout(() => {
      window.location.href = 'https://demo.launchapropfirm.com';
    }, 500);
  </script>
</body>
</html>

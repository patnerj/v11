<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlphaCapital WebSocket Gateway Live Tester</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #f9fafb;
      padding: 24px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .badge.connected {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
      color: #10b981;
    }
    .badge.disconnected {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .controls {
      display: flex;
      gap: 12px;
      background: #111827;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #1f2937;
      margin-bottom: 24px;
      align-items: center;
    }
    input {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f9fafb;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      flex: 1;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #374151; }
    button.secondary:hover { background: #4b5563; }
    button.success { background: #059669; }
    button.success:hover { background: #047857; }
    button.warning { background: #d97706; }
    button.warning:hover { background: #b45309; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 16px;
      transition: border-color 0.3s, background-color 0.3s;
    }
    .card.flash-up {
      background-color: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
    }
    .card.flash-down {
      background-color: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
    }
    .symbol-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      color: #93c5fd;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .price-val {
      font-family: monospace;
      font-weight: 700;
      font-size: 16px;
    }
    .terminal {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 14px;
      font-family: monospace;
      font-size: 12px;
      height: 220px;
      overflow-y: auto;
      color: #cbd5e1;
    }
    .log-line {
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .log-time { color: #64748b; }
    .log-in { color: #38bdf8; }
    .log-out { color: #4ade80; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>⚡ WebSocket Price Stream Live Tester</h1>
        <div style="color: #9ca3af; font-size: 13px; margin-top: 4px;">AlphaCapital Enterprise v11.5 Gateway Live Monitor</div>
      </div>
      <div id="statusBadge" class="badge disconnected">
        <span class="dot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </header>

    <div class="controls">
      <input type="text" id="wsUrl" value="ws://127.0.0.1:8080">
      <button id="btnConnect" onclick="toggleConnect()">Connect</button>
      <button class="success" onclick="pushSingleTick()">🚀 Push Live Tick</button>
      <button class="warning" id="btnStress" onclick="toggleStressTest()">🔥 Start Rapid Stream (10/s)</button>
    </div>

    <div class="grid">
      <div class="card" id="cardEURUSD">
        <div class="symbol-title">
          <span>EUR/USD</span>
          <span style="font-size: 12px; color: #9ca3af;" id="timeEURUSD">--:--:--</span>
        </div>
        <div class="price-row"><span>Bid:</span><span class="price-val" id="bidEURUSD">--</span></div>
        <div class="price-row"><span>Ask:</span><span class="price-val" id="askEURUSD">--</span></div>
        <div class="price-row"><span>Mid:</span><span class="price-val" id="midEURUSD">--</span></div>
      </div>

      <div class="card" id="cardXAUUSD">
        <div class="symbol-title">
          <span>XAU/USD (Gold)</span>
          <span style="font-size: 12px; color: #9ca3af;" id="timeXAUUSD">--:--:--</span>
        </div>
        <div class="price-row"><span>Bid:</span><span class="price-val" id="bidXAUUSD">--</span></div>
        <div class="price-row"><span>Ask:</span><span class="price-val" id="askXAUUSD">--</span></div>
        <div class="price-row"><span>Mid:</span><span class="price-val" id="midXAUUSD">--</span></div>
      </div>

      <div class="card" id="cardBTCUSD">
        <div class="symbol-title">
          <span>BTC/USD (Bitcoin)</span>
          <span style="font-size: 12px; color: #9ca3af;" id="timeBTCUSD">--:--:--</span>
        </div>
        <div class="price-row"><span>Bid:</span><span class="price-val" id="bidBTCUSD">--</span></div>
        <div class="price-row"><span>Ask:</span><span class="price-val" id="askBTCUSD">--</span></div>
        <div class="price-row"><span>Mid:</span><span class="price-val" id="midBTCUSD">--</span></div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <h3 style="margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: #9ca3af;">Live Broadcast Stream Messages</h3>
      <button class="secondary" style="padding: 4px 10px; font-size: 12px;" onclick="clearLog()">Clear Log</button>
    </div>
    <div class="terminal" id="terminal"></div>
  </div>

  <script>
    let ws = null;
    let stressInterval = null;
    const SECRET_TOKEN = 'a4f9b8c2e1d74653a928f01b54e76c3d82a10e4b7c6d5e9f1a2b3c4d5e6f7a8b';
    const lastPrices = {};

    function log(msg, type = 'info') {
      const term = document.getElementById('terminal');
      const time = new Date().toLocaleTimeString();
      let colorClass = '';
      if (type === 'in') colorClass = 'log-in';
      if (type === 'out') colorClass = 'log-out';
      term.innerHTML += `<div class="log-line ${colorClass}"><span class="log-time">[${time}]</span> ${msg}</div>`;
      term.scrollTop = term.scrollHeight;
    }

    function clearLog() {
      document.getElementById('terminal').innerHTML = '';
    }

    function toggleConnect() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        ws.close();
      } else {
        connect();
      }
    }

    function connect() {
      const url = document.getElementById('wsUrl').value;
      log(`Connecting to ${url}...`, 'info');
      try {
        ws = new WebSocket(url);
      } catch (e) {
        log('Connection init error: ' + e.message, 'info');
        return;
      }

      ws.onopen = () => {
        document.getElementById('statusBadge').className = 'badge connected';
        document.getElementById('statusText').innerText = 'Connected (0ms Stream)';
        document.getElementById('btnConnect').innerText = 'Disconnect';
        log('🟢 WebSocket connection established successfully!', 'in');
      };

      ws.onmessage = (ev) => {
        try {
          const payload = JSON.parse(ev.data);
          if (payload.type === 'prices') {
            updatePrices(payload.data);
          }
        } catch (err) {
          log('Malformed payload: ' + ev.data, 'info');
        }
      };

      ws.onclose = () => {
        document.getElementById('statusBadge').className = 'badge disconnected';
        document.getElementById('statusText').innerText = 'Disconnected';
        document.getElementById('btnConnect').innerText = 'Connect';
        log('🔴 WebSocket connection closed.', 'info');
      };

      ws.onerror = (err) => {
        log('⚠️ WebSocket error occurred.', 'info');
      };
    }

    function updatePrices(prices) {
      const count = Object.keys(prices).length;
      log(`⚡ Received real-time broadcast: ${count} symbol(s) updated`, 'in');

      for (const [sym, quote] of Object.entries(prices)) {
        const card = document.getElementById('card' + sym);
        const bidEl = document.getElementById('bid' + sym);
        const askEl = document.getElementById('ask' + sym);
        const midEl = document.getElementById('mid' + sym);
        const timeEl = document.getElementById('time' + sym);

        if (bidEl && quote.bid !== undefined) {
          const oldBid = lastPrices[sym] || quote.bid;
          bidEl.innerText = quote.bid.toFixed(sym === 'EURUSD' ? 5 : 2);
          askEl.innerText = quote.ask.toFixed(sym === 'EURUSD' ? 5 : 2);
          midEl.innerText = quote.mid.toFixed(sym === 'EURUSD' ? 5 : 2);
          if (timeEl) timeEl.innerText = new Date(quote.ts * (quote.ts < 1e12 ? 1000 : 1)).toLocaleTimeString();

          if (card) {
            card.classList.remove('flash-up', 'flash-down');
            void card.offsetWidth; // trigger reflow
            if (quote.bid > oldBid) card.classList.add('flash-up');
            else if (quote.bid < oldBid) card.classList.add('flash-down');
            setTimeout(() => card.classList.remove('flash-up', 'flash-down'), 400);
          }

          lastPrices[sym] = quote.bid;
        }
      }
    }

    async function pushSingleTick() {
      const eurusd = 1.08500 + (Math.random() - 0.5) * 0.00200;
      const xauusd = 2650.00 + (Math.random() - 0.5) * 5.0;
      const btcusd = 68500.0 + (Math.random() - 0.5) * 250.0;
      const now = Math.floor(Date.now() / 1000);

      const payload = {
        prices: {
          EURUSD: { bid: parseFloat(eurusd.toFixed(5)), ask: parseFloat((eurusd + 0.00015).toFixed(5)), mid: parseFloat((eurusd + 0.00007).toFixed(5)), ts: now },
          XAUUSD: { bid: parseFloat(xauusd.toFixed(2)), ask: parseFloat((xauusd + 0.30).toFixed(2)), mid: parseFloat((xauusd + 0.15).toFixed(2)), ts: now },
          BTCUSD: { bid: parseFloat(btcusd.toFixed(1)), ask: parseFloat((btcusd + 15.0).toFixed(1)), mid: parseFloat((btcusd + 7.5).toFixed(1)), ts: now },
        }
      };

      try {
        log('📤 Pushing live tick to POST http://127.0.0.1:8080/push...', 'out');
        const res = await fetch('http://127.0.0.1:8080/push', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + SECRET_TOKEN
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        log(`✅ Push accepted by gateway (Broadcasted to ${data.broadcastCount} client(s))`, 'out');
      } catch (e) {
        log('❌ Push failed: ' + e.message, 'info');
      }
    }

    function toggleStressTest() {
      const btn = document.getElementById('btnStress');
      if (stressInterval) {
        clearInterval(stressInterval);
        stressInterval = null;
        btn.innerText = '🔥 Start Rapid Stream (10/s)';
        btn.className = 'warning';
      } else {
        btn.innerText = '⏹ Stop Rapid Stream';
        btn.className = 'secondary';
        stressInterval = setInterval(() => {
          pushSingleTick();
        }, 100);
      }
    }

    // Auto-connect on load
    window.addEventListener('load', () => {
      connect();
    });
  </script>
</body>
</html>
